name: Android APK

# Pull requests: type-check only. Pushes to master and manual runs: build the staff-phone APK.
# Pushes to master also publish an over-the-air update (EAS Update): installed APKs with the same
# native code download the new JS on launch and run it on the next start.
on:
  push:
    branches: [master]
    paths: ['mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  update:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Updates stay off until the Expo project is linked and its token is in GitHub Secrets
      - name: Check EAS Update setup
        id: setup
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::No EXPO_TOKEN secret: skipping the over-the-air update."
          elif ! grep -q '"projectId"' app.json; then
            echo "::warning::app.json has no extra.eas.projectId (run npx eas-cli init): skipping the over-the-air update."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.setup.outputs.ready == 'true'
        run: npm ci

      - name: Publish update
        if: steps.setup.outputs.ready == 'true'
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: npx --yes eas-cli@latest update --channel production --environment production --message "${MESSAGE%%$'\n'*}" --non-interactive

  apk:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      # Rises with every run so a new APK installs over the previous one
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle downloads and build outputs between runs
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      # Phone CPUs only (no emulator x86 builds): faster build, smaller APK
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Sign with the Layali release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            OUT="layali-pos-${APP_VERSION}.apk"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            # apksigner replaces the template's debug signature with the release key
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$OUT" "$APK"
            "$BUILD_TOOLS/apksigner" verify "$OUT"
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            OUT="layali-pos-${APP_VERSION}-debug-signed.apk"
            echo "::warning::No release key in GitHub Secrets. This APK is debug-signed: fine for testing, but it cannot update an app installed from a release-signed APK. Run scripts/create-android-key.sh and add the four ANDROID_* secrets."
            cp "$APK" "$OUT"
          fi
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: layali-pos-apk-${{ github.run_number }}
          path: mobile/${{ env.APK_FILE }}
          retention-days: 30
          if-no-files-found: error
